<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Your content goes here -->
  <div class="video-container" id="videoWrapper" style="height: 5000px;"> <!-- Creates scrolling space -->
    <video id="scrollVideo" style="position: fixed; top: 10px; left: 10px; width: 1920px;" muted playsinline>
      <source src="AerialFixed.mp4" type="video/mp4">
    </video>
  </div>

    <div class="video-overlay">
      <h1 class="overlay-text text-1">Welcome</h1>
      <h1 class="overlay-text text-2">to the greatest civilisation of all time</h1>
      <h1 class="overlay-text text-3">Rome</h1>
    </div>
  </div>


</body>
</html>

<script>
  const video = document.getElementById('scrollVideo');

  window.addEventListener('scroll', () => {
    // Calculate the total scrollable height
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    
    // Get current scroll position as a ratio between 0 and 1
    const scrollFraction = window.scrollY / maxScroll;
    
    // Assign calculated time back to the video
    if (video.duration) {
      video.currentTime = scrollFraction * video.duration;
    }
  });
</script>
